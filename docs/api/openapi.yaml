openapi: 3.1.0
info:
  title: KINGDOM Quest API
  version: 1.0.0
  description: >-
    Versioned REST API for KINGDOM Quest. Google OAuth and email/password
    authentication use an HTTP-only session cookie; state-changing requests
    require a Rails CSRF token.
    Creator endpoints are authenticated and owner-scoped. Published share
    codes and learner-play endpoints are public by design.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      summary: Check API process health
      responses:
        "200":
          description: The API process is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  status: ok
                  api_version: v1
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get a token for same-origin state-changing requests
      responses:
        "200":
          description: Rails CSRF token bound to the current browser session.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/CsrfToken"
  /auth/email/register:
    post:
      operationId: registerWithEmail
      summary: Create an email account and send a verification code
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRegistration"
      responses:
        "201":
          description: Account created; verify the email address before signing in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationRequired"
        "409":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Code request limit exceeded.
        "503":
          description: Email delivery is temporarily unavailable.
  /auth/email/login:
    post:
      operationId: signInWithEmail
      summary: Sign in with a verified email and password
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPasswordCredentials"
      responses:
        "200":
          description: Signed in; an encrypted session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Encrypted, HTTP-only, same-site session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Email or password is incorrect.
        "403":
          description: Email is not verified or the account is inactive.
        "429":
          description: Sign-in attempt limit exceeded.
  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Verify an email address with a one-time code
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCode"
      responses:
        "200":
          description: Email verified and signed in; an encrypted session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Encrypted, HTTP-only, same-site session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/email/resend-verification:
    post:
      operationId: resendEmailVerification
      summary: Request another email verification code
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAddress"
      responses:
        "200":
          description: Generic response that does not disclose account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          description: Code request cooldown or limit exceeded.
        "503":
          description: Email delivery is temporarily unavailable.
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Request a one-time password reset code
      description: Always returns a generic response to avoid disclosing whether an email/password account exists.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAddress"
      responses:
        "200":
          description: Generic response whether or not an email/password account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          description: Code request cooldown or limit exceeded.
        "503":
          description: Email delivery is temporarily unavailable.
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password using a one-time code
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "200":
          description: Password changed and signed in; previous sessions are revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Encrypted, HTTP-only, same-site session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/google_oauth2:
    post:
      operationId: startGoogleSignIn
      summary: Start Google OAuth sign-in
      description: Submit a same-origin form; the Rails OAuth CSRF middleware validates the token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [authenticity_token]
              properties:
                  authenticity_token:
                    type: string
      responses:
        "302":
          description: Redirect to Google or the configured OAuth failure handler.
        "403":
          description: The Rails CSRF token is missing or invalid.
  /auth/google_oauth2/callback:
    get:
      operationId: completeGoogleSignIn
      summary: Complete Google OAuth callback
      description: Google redirects here; only verified Google email identities are accepted.
      responses:
        "303":
          description: Redirect to the configured web application.
          headers:
            Set-Cookie:
              schema:
                  type: string
              description: Encrypted, HTTP-only, same-site session cookie.
  /auth/session:
    delete:
      operationId: destroyCurrentSession
      summary: Revoke the current sign-in session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookie cleared.
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user profile
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /assets/upload:
    post:
      operationId: uploadQuestCover
      summary: Upload a quest cover image to EKD Digital Assets
      description: Authenticated endpoint. Accepts a single PNG, JPEG, or WebP file up to 5 MB.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                  file:
                    type: string
                    format: binary
      responses:
        "201":
          description: Uploaded image associated with the current user.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/UploadedAsset"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: EKD Digital Assets rejected the upload or was unavailable.
  /activities:
    get:
      operationId: listCreatorActivities
      summary: List the signed-in creator's quests
      description: Returns owner-scoped quest summaries and aggregate play counts.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The creator's quests and studio summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activities, summary]
                    properties:
                      activities:
                        type: array
                        items:
                          type: object
                          required: [id, title, description, status, question_count, share_code, version, total_plays, updated_at, published_at]
                          properties:
                            id:
                              type: string
                              format: uuid
                            title:
                              type: string
                            description:
                              type: string
                            status:
                              type: string
                              enum: [draft, published]
                            question_count:
                              type: integer
                            share_code:
                              type: [string, "null"]
                              minLength: 6
                              maxLength: 6
                            version:
                              type: [integer, "null"]
                            total_plays:
                              type: integer
                            updated_at:
                              type: string
                              format: date-time
                            published_at:
                              type: [string, "null"]
                              format: date-time
                      summary:
                        type: object
                        required: [total, published, plays]
                        properties:
                          total:
                            type: integer
                          published:
                            type: integer
                          plays:
                            type: integer
        "401":
          $ref: "#/components/responses/AuthenticationError"
    post:
      operationId: createActivity
      summary: Create a draft activity
      description: Creates a draft quest owned by the signed-in creator.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity]
              properties:
                  activity:
                    type: object
                    required: [title, description, questions]
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      cover_image_asset_id:
                        type: string
                        format: uuid
                      shuffle_questions:
                        type: boolean
                        default: false
                      speed_scoring:
                        type: boolean
                        default: true
                      questions:
                        type: array
                        items:
                          $ref: "#/components/schemas/QuestionDraft"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [id, title, description, question_count, status]
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        description:
                          type: string
                        question_count:
                          type: integer
                        status:
                          type: string
                          const: draft
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /activities/{activity_id}:
    get:
      operationId: getCreatorActivity
      summary: Get an owner-scoped quest and answer key
      description: Returns question definitions and answer keys only to the signed-in owner.
      security:
        - sessionCookie: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The creator's quest details, including correct answers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CreatorActivityDetail"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /activities/{activity_id}/publications:
    parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: publishActivity
      summary: Publish an immutable activity version
      description: Publishes an immutable version of a quest owned by the signed-in creator.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Published version and learner share code.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [activity_id, title, version, share_code, play_path]
                      properties:
                        activity_id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        version:
                          type: integer
                        share_code:
                          type: string
                        play_path:
                          type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /activities/{activity_id}/revisions:
    parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revisePublishedActivity
      summary: Create a new immutable version of a published quest
      description: >-
        Replaces the latest creator-facing question list by creating a new
        immutable version with a new share code. Existing versions, learner
        attempts, and rooms keep their original snapshots and links. The
        expected version prevents overwriting a concurrent revision.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: object
                  required: [expected_version, shuffle_questions, speed_scoring, questions]
                  properties:
                    expected_version:
                      type: integer
                      minimum: 1
                    shuffle_questions:
                      type: boolean
                    speed_scoring:
                      type: boolean
                    questions:
                      type: array
                      minItems: 1
                      items:
                        allOf:
                          - $ref: "#/components/schemas/QuestionDraft"
                          - type: object
                            required: [id]
                            properties:
                              id:
                                type: string
                                format: uuid
      responses:
        "201":
          description: New immutable version and learner share code.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activity_id, title, version, share_code, play_path]
                    properties:
                      activity_id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      version:
                        type: integer
                      share_code:
                        type: string
                        minLength: 6
                        maxLength: 6
                      play_path:
                        type: string
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The latest version changed after the creator loaded it.
        "422":
          $ref: "#/components/responses/ValidationError"
  /play/{share_code}:
    parameters:
      - $ref: "#/components/parameters/ShareCode"
    get:
      operationId: getPublishedActivity
      summary: Get learner-safe activity content
      description: Correct answer identifiers are not included in this response.
      responses:
        "200":
          description: Published activity content.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/PlayActivity"
        "404":
          $ref: "#/components/responses/NotFound"
  /join/{code}:
    get:
      operationId: resolveGameCode
      summary: Resolve an activity code or live-room code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6}$"
      responses:
        "200":
          description: Destination for the public join link.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [kind, path]
                    properties:
                      kind:
                        type: string
                        enum: [self_paced, live_room]
                      path:
                        type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /play/{share_code}/leaderboard:
    get:
      operationId: getProvisionalLeaderboard
      summary: Get completed participant-paced attempts
      description: Standings are provisional and sorted by score, cumulative response time, and display name.
      parameters:
        - $ref: "#/components/parameters/ShareCode"
      responses:
        "200":
          description: Current provisional standings and top-three podium.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, participant_count, podium, standings]
                    properties:
                      status:
                        type: string
                        const: provisional
                      participant_count:
                        type: integer
                      podium:
                        type: array
                        items:
                          $ref: "#/components/schemas/LeaderboardEntry"
                      standings:
                        type: array
                        items:
                          $ref: "#/components/schemas/LeaderboardEntry"
        "404":
          $ref: "#/components/responses/NotFound"
  /activities/{activity_id}/game_rooms:
    post:
      operationId: createGameRoom
      summary: Create a host-controlled room for a published activity
      description: The signed-in activity owner receives a unique room code and join link.
      security:
        - sessionCookie: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Waiting room created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GameRoom"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /game_rooms/{room_code}:
    get:
      operationId: getGameRoom
      summary: Get live room state and standings
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - name: session_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current room, synchronized question, participant list, and standings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GameRoom"
        "404":
          $ref: "#/components/responses/NotFound"
  /game_rooms/{room_code}/participants:
    post:
      operationId: joinGameRoom
      summary: Join a waiting room as a guest participant
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/CsrfToken"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant]
              properties:
                participant:
                  type: object
                  required: [learner_name]
                  properties:
                    learner_name:
                      type: string
                      minLength: 1
                      maxLength: 80
      responses:
        "201":
          description: Guest joined the waiting room.
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /game_rooms/{room_code}/start:
    post:
      operationId: startGameRoom
      summary: Start the first synchronized round
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Room moved to active state.
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "409":
          description: Room is not waiting.
  /game_rooms/{room_code}/participants/{session_id}:
    patch:
      operationId: renameGameRoomParticipant
      summary: Change a participant display name before answering the active round
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant]
              properties:
                participant:
                  type: object
                  required: [learner_name]
                  properties:
                    learner_name:
                      type: string
                      minLength: 1
                      maxLength: 80
      responses:
        "200":
          description: Display name changed.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The participant already answered the current round.
  /game_rooms/{room_code}/participants/{session_id}/answers:
    post:
      operationId: answerLiveRound
      summary: Record a participant answer against the room's shared deadline
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  type: object
                  required: [question_id]
                  properties:
                    question_id:
                      type: string
                      format: uuid
                    option_id:
                      type: [string, "null"]
                      format: uuid
                      description: Used for single-choice questions; null is accepted only after timeout.
                    option_ids:
                      type: array
                      uniqueItems: true
                      items:
                        type: string
                        format: uuid
                      description: Used for multiple-select questions; an empty array is accepted only after timeout.
      responses:
        "200":
          description: Server-scored response recorded.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency conflict or round deadline has not elapsed.
        "422":
          $ref: "#/components/responses/ValidationError"
  /game_rooms/{room_code}/advance:
    post:
      operationId: advanceGameRoom
      summary: End the current round and start the next, or finalize the room
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Room moved to the next round or completed state.
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "409":
          description: Room is not active.
  /play/{share_code}/sessions:
    parameters:
      - $ref: "#/components/parameters/ShareCode"
    post:
      operationId: startPlaySession
      summary: Start a server-timed learner session
      description: Creates an idempotent play session and starts the first question's server-side timer.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [play_session]
              properties:
                  play_session:
                    type: object
                    required: [learner_name]
                    properties:
                      learner_name:
                        type: string
                        minLength: 1
                        maxLength: 80
      responses:
        "201":
          description: Play session created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PlaySession"
        "200":
          description: Existing session returned for an idempotent retry.
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /play/{share_code}/sessions/{session_id}/answers:
    parameters:
      - $ref: "#/components/parameters/ShareCode"
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: answerPlayQuestion
      summary: Record an answer or a server-confirmed timeout
      description: Advances one question in order. Expired answers are recorded as unanswered and score zero.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  type: object
                  required: [question_id]
                  properties:
                    question_id:
                      type: string
                      format: uuid
                    option_id:
                      type: [string, "null"]
                      format: uuid
                      description: Null is accepted only after the server-side deadline has passed.
                    option_ids:
                      type: array
                      uniqueItems: true
                      items:
                        type: string
                        format: uuid
                      description: Used for multiple-select; an empty array is accepted only after the server-side deadline.
      responses:
        "200":
          description: Question accepted; returns the next timer or the completed attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PlaySessionProgress"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Request key conflict or timeout has not yet elapsed.
        "422":
          $ref: "#/components/responses/ValidationError"
  /play/{share_code}/sessions/{session_id}:
    patch:
      operationId: renamePlaySession
      summary: Change a learner display name before the attempt completes
      parameters:
        - $ref: "#/components/parameters/ShareCode"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [play_session]
              properties:
                play_session:
                  type: object
                  required: [learner_name]
                  properties:
                    learner_name:
                      type: string
                      minLength: 1
                      maxLength: 80
      responses:
        "200":
          description: Display name changed.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The attempt is already complete.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kquest_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    ShareCode:
      name: share_code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-HJ-NP-Z2-9]{6}$"
    RoomCode:
      name: room_code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-HJ-NP-Z2-9]{6}$"
  responses:
    AuthenticationError:
      description: Sign-in is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or unavailable in this environment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Submitted data is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EmailAddress:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    EmailRegistration:
      allOf:
        - $ref: "#/components/schemas/EmailAddress"
        - type: object
          required: [name, password, password_confirmation]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 160
            password:
              type: string
              minLength: 12
              description: Maximum 72 UTF-8 bytes.
            password_confirmation:
              type: string
    EmailPasswordCredentials:
      allOf:
        - $ref: "#/components/schemas/EmailAddress"
        - type: object
          required: [password]
          properties:
            password:
              type: string
              minLength: 12
              description: Maximum 72 UTF-8 bytes.
    EmailCode:
      allOf:
        - $ref: "#/components/schemas/EmailAddress"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              pattern: "^\\d{6}$"
    PasswordReset:
      allOf:
        - $ref: "#/components/schemas/EmailCode"
        - type: object
          required: [password, password_confirmation]
          properties:
            password:
              type: string
              minLength: 12
              description: Maximum 72 UTF-8 bytes.
            password_confirmation:
              type: string
    EmailVerificationRequired:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [verification_required, email]
          properties:
            verification_required:
              type: boolean
              const: true
            email:
              type: string
              format: email
    MessageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
    UserProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserProfile"
    CsrfToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    UserProfile:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    UploadedAsset:
      type: object
      required: [id, public_url, content_type, file_size]
      properties:
        id:
          type: string
          format: uuid
        public_url:
          type: string
          format: uri
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        file_size:
          type: integer
          maximum: 5242880
    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - status
            - api_version
          properties:
            status:
              type: string
              const: ok
            api_version:
              type: string
              const: v1
    CreatorActivityDetail:
      type: object
      description: Published quests use the latest immutable version snapshot; drafts use editable question rows.
      required:
        - id
        - title
        - description
        - status
        - question_count
        - share_code
        - version
        - total_plays
        - updated_at
        - published_at
        - shuffle_questions
        - speed_scoring
        - questions
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published]
        question_count:
          type: integer
        share_code:
          type: [string, "null"]
        version:
          type: [integer, "null"]
        total_plays:
          type: integer
        updated_at:
          type: string
          format: date-time
        published_at:
          type: [string, "null"]
          format: date-time
        shuffle_questions:
          type: boolean
        speed_scoring:
          type: boolean
        questions:
          type: array
          items:
            $ref: "#/components/schemas/CreatorQuestion"
    CreatorQuestion:
      type: object
      required:
        - id
        - position
        - question_type
        - prompt
        - options
        - correct_option_id
        - correct_option_ids
        - points
        - time_limit_seconds
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
        question_type:
          type: string
          enum: [single_choice, multiple_select]
        prompt:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/ChoiceOption"
        correct_option_id:
          type: string
          format: uuid
        correct_option_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        points:
          type: integer
        time_limit_seconds:
          $ref: "#/components/schemas/QuestionTimeLimitSeconds"
    QuestionDraft:
      type: object
      required: [prompt, options, correct_option_id, points]
      properties:
        question_type:
          type: string
          enum: [single_choice, multiple_select]
          default: single_choice
        prompt:
          type: string
          maxLength: 500
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/ChoiceOption"
        correct_option_id:
          type: string
          format: uuid
          description: Required for single choice; also set to the first correct option for compatibility.
        correct_option_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Required for multiple select; selecting exactly this set is correct.
        points:
          type: integer
          minimum: 1
          maximum: 1000
        time_limit_seconds:
          $ref: "#/components/schemas/QuestionTimeLimitSeconds"
          default: 30
    QuestionTimeLimitSeconds:
      description: Zero disables the per-question timer; otherwise 5–300 seconds.
      anyOf:
        - type: integer
          const: 0
        - type: integer
          minimum: 5
          maximum: 300
    ChoiceOption:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 160
    PlayActivity:
      type: object
      required: [id, title, share_code, cover_image_url, questions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        share_code:
          type: string
        cover_image_url:
          type: [string, "null"]
        questions:
          type: array
          items:
            type: object
            required: [id, prompt, question_type, points, speed_scoring, time_limit_seconds, options]
            properties:
              id:
                type: string
                format: uuid
              question_type:
                type: string
                enum: [single_choice, multiple_select]
              prompt:
                type: string
              points:
                type: integer
              speed_scoring:
                type: boolean
              time_limit_seconds:
                $ref: "#/components/schemas/QuestionTimeLimitSeconds"
              options:
                type: array
                items:
                  $ref: "#/components/schemas/ChoiceOption"
    PlaySession:
      type: object
      required:
        - id
        - question_index
        - time_limit_seconds
        - time_remaining_seconds
        - question_started_at
        - server_time
      properties:
        id:
          type: string
          format: uuid
        question_index:
          type: integer
          minimum: 0
        time_limit_seconds:
          $ref: "#/components/schemas/QuestionTimeLimitSeconds"
        time_remaining_seconds:
          type: number
          minimum: 0
        question_started_at:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
    PlaySessionProgress:
      type: object
      required: [complete, is_correct, timed_out, points_awarded, speed_bonus]
      properties:
        complete:
          type: boolean
        is_correct:
          type: boolean
          description: Correctness of only the submitted answer; answer identifiers are withheld until completion.
        timed_out:
          type: boolean
        points_awarded:
          type: integer
        base_points:
          type: integer
        speed_bonus:
          type: integer
        question_index:
          type: integer
          minimum: 0
        time_limit_seconds:
          $ref: "#/components/schemas/QuestionTimeLimitSeconds"
        question_started_at:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        attempt:
          $ref: "#/components/schemas/AttemptResult"
      oneOf:
        - required: [complete, question_index, time_limit_seconds, question_started_at, server_time]
          properties:
            complete:
              const: false
        - required: [complete, attempt]
          properties:
            complete:
              const: true
    AttemptResult:
      type: object
      required: [id, learner_name, score, max_score, total_response_time_ms, results]
      properties:
        id:
          type: string
          format: uuid
        learner_name:
          type: string
        score:
          type: integer
        max_score:
          type: integer
        total_response_time_ms:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            type: object
            required:
              - question_id
              - prompt
              - timed_out
              - points_awarded
              - points_possible
            properties:
              question_id:
                type: string
                format: uuid
              prompt:
                type: string
              selected_option_id:
                type: [string, "null"]
                format: uuid
              correct_option_id:
                type: string
                format: uuid
              selected_option_ids:
                type: array
                items:
                  type: string
                  format: uuid
              correct_option_ids:
                type: array
                items:
                  type: string
                  format: uuid
              timed_out:
                type: boolean
              points_awarded:
                type: integer
              points_possible:
                type: integer
              speed_bonus:
                type: integer
              response_time_ms:
                type: [integer, "null"]
              correct:
                type: boolean
    LeaderboardEntry:
      type: object
      required: [rank, learner_name, score, response_time_ms]
      properties:
        rank:
          type: integer
          minimum: 1
        learner_name:
          type: string
        score:
          type: integer
          minimum: 0
        max_score:
          type: [integer, "null"]
        response_time_ms:
          type: integer
          minimum: 0
    GameRoom:
      type: object
      required: [room_code, title, status, question_index, question_count, current_question, question_started_at, time_remaining_seconds, server_time, participant_count, answered_count, participants, participant, standings, podium, standings_final]
      properties:
        room_code:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [waiting, active, completed]
        question_index:
          type: integer
        question_count:
          type: integer
        current_question:
          type: [object, "null"]
        question_started_at:
          type: [string, "null"]
          format: date-time
        time_remaining_seconds:
          type: number
          minimum: 0
        server_time:
          type: string
          format: date-time
        participant_count:
          type: integer
        answered_count:
          type: integer
        participants:
          type: array
          items:
            type: object
            required: [learner_name, completed, answered]
            properties:
              learner_name:
                type: string
              completed:
                type: boolean
              answered:
                type: boolean
                description: Whether this participant answered the currently active question.
        participant:
          type: [object, "null"]
        standings:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        podium:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        standings_final:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
