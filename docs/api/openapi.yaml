openapi: 3.1.0
info:
  title: KINGDOM Quest API
  version: 1.0.0
  description: >-
    Versioned REST API for KINGDOM Quest. Google OAuth uses an HTTP-only
    session cookie; state-changing requests require a Rails CSRF token.
    Content, upload, and learner-play prototype endpoints remain development
    and test only until roles and abuse protections are complete.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      summary: Check API process health
      responses:
        "200":
          description: The API process is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  status: ok
                  api_version: v1
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get a token for same-origin state-changing requests
      responses:
        "200":
          description: Rails CSRF token bound to the current browser session.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/CsrfToken"
  /auth/google_oauth2:
    post:
      operationId: startGoogleSignIn
      summary: Start Google OAuth sign-in
      description: Submit a same-origin form; the Rails OAuth CSRF middleware validates the token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [authenticity_token]
              properties:
                  authenticity_token:
                    type: string
      responses:
        "302":
          description: Redirect to Google or the configured OAuth failure handler.
        "403":
          description: The Rails CSRF token is missing or invalid.
  /auth/google_oauth2/callback:
    get:
      operationId: completeGoogleSignIn
      summary: Complete Google OAuth callback
      description: Google redirects here; only verified Google email identities are accepted.
      responses:
        "303":
          description: Redirect to the configured web application.
          headers:
            Set-Cookie:
              schema:
                  type: string
              description: Encrypted, HTTP-only, same-site session cookie.
  /auth/session:
    delete:
      operationId: destroyCurrentSession
      summary: Revoke the current sign-in session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookie cleared.
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user profile
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /assets/upload:
    post:
      operationId: uploadQuestCover
      summary: Upload a quest cover image to EKD Digital Assets
      description: Authenticated development/test prototype endpoint. Accepts a single PNG, JPEG, or WebP file up to 5 MB.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                  file:
                    type: string
                    format: binary
      responses:
        "201":
          description: Uploaded image associated with the current user.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/UploadedAsset"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: EKD Digital Assets rejected the upload or was unavailable.
  /activities:
    post:
      operationId: createActivity
      summary: Create a draft activity
      description: Authenticated, user-owned development/test prototype endpoint; unavailable in production.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity]
              properties:
                  activity:
                    type: object
                    required: [title, description, questions]
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      cover_image_asset_id:
                        type: string
                        format: uuid
                      questions:
                        type: array
                        items:
                          $ref: "#/components/schemas/QuestionDraft"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [id, title, description, question_count, status]
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        description:
                          type: string
                        question_count:
                          type: integer
                        status:
                          type: string
                          const: draft
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /activities/{activity_id}/publications:
    parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: publishActivity
      summary: Publish an immutable activity version
      description: Authenticated, owner-scoped development/test prototype endpoint; unavailable in production.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Published version and learner share code.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [title, version, share_code, play_path]
                      properties:
                        title:
                          type: string
                        version:
                          type: integer
                        share_code:
                          type: string
                        play_path:
                          type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /play/{share_code}:
    parameters:
      - $ref: "#/components/parameters/ShareCode"
    get:
      operationId: getPublishedActivity
      summary: Get learner-safe activity content
      description: Correct answer identifiers are not included in this response.
      responses:
        "200":
          description: Published activity content.
          content:
            application/json:
              schema:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: "#/components/schemas/PlayActivity"
        "404":
          $ref: "#/components/responses/NotFound"
  /play/{share_code}/sessions:
    parameters:
      - $ref: "#/components/parameters/ShareCode"
    post:
      operationId: startPlaySession
      summary: Start a server-timed learner session
      description: Creates an idempotent play session and starts the first question's server-side timer.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [play_session]
              properties:
                  play_session:
                    type: object
                    required: [learner_name]
                    properties:
                      learner_name:
                        type: string
                        minLength: 1
                        maxLength: 80
      responses:
        "201":
          description: Play session created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PlaySession"
        "200":
          description: Existing session returned for an idempotent retry.
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /play/{share_code}/sessions/{session_id}/answers:
    parameters:
      - $ref: "#/components/parameters/ShareCode"
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: answerPlayQuestion
      summary: Record an answer or a server-confirmed timeout
      description: Advances one question in order. Expired answers are recorded as unanswered and score zero.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  type: object
                  required: [question_id]
                  properties:
                    question_id:
                      type: string
                      format: uuid
                    option_id:
                      type: [string, "null"]
                      format: uuid
                      description: Null is accepted only after the server-side deadline has passed.
      responses:
        "200":
          description: Question accepted; returns the next timer or the completed attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PlaySessionProgress"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Request key conflict or timeout has not yet elapsed.
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kquest_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    ShareCode:
      name: share_code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-HJ-NP-Z2-9]{12}$"
  responses:
    AuthenticationError:
      description: Sign-in is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or unavailable in this environment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Submitted data is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CsrfToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    UserProfile:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    UploadedAsset:
      type: object
      required: [id, public_url, content_type, file_size]
      properties:
        id:
          type: string
          format: uuid
        public_url:
          type: string
          format: uri
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        file_size:
          type: integer
          maximum: 5242880
    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - status
            - api_version
          properties:
            status:
              type: string
              const: ok
            api_version:
              type: string
              const: v1
    QuestionDraft:
      type: object
      required: [prompt, options, correct_option_id, points]
      properties:
        prompt:
          type: string
          maxLength: 500
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/ChoiceOption"
        correct_option_id:
          type: string
          format: uuid
        points:
          type: integer
          minimum: 1
          maximum: 1000
        time_limit_seconds:
          $ref: "#/components/schemas/QuestionTimeLimitSeconds"
          default: 30
    QuestionTimeLimitSeconds:
      description: Zero disables the per-question timer; otherwise 5–300 seconds.
      anyOf:
        - type: integer
          const: 0
        - type: integer
          minimum: 5
          maximum: 300
    ChoiceOption:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 160
    PlayActivity:
      type: object
      required: [id, title, share_code, cover_image_url, questions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        share_code:
          type: string
        cover_image_url:
          type: [string, "null"]
        questions:
          type: array
          items:
            type: object
            required: [id, prompt, points, time_limit_seconds, options]
            properties:
              id:
                type: string
                format: uuid
              prompt:
                type: string
              points:
                type: integer
              time_limit_seconds:
                $ref: "#/components/schemas/QuestionTimeLimitSeconds"
              options:
                type: array
                items:
                  $ref: "#/components/schemas/ChoiceOption"
    PlaySession:
      type: object
      required:
        - id
        - question_index
        - time_limit_seconds
        - time_remaining_seconds
        - question_started_at
        - server_time
      properties:
        id:
          type: string
          format: uuid
        question_index:
          type: integer
          minimum: 0
        time_limit_seconds:
          $ref: "#/components/schemas/QuestionTimeLimitSeconds"
        time_remaining_seconds:
          type: number
          minimum: 0
        question_started_at:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
    PlaySessionProgress:
      type: object
      required: [complete, is_correct, timed_out]
      properties:
        complete:
          type: boolean
        is_correct:
          type: boolean
          description: Correctness of only the submitted answer; answer identifiers are withheld until completion.
        timed_out:
          type: boolean
        question_index:
          type: integer
          minimum: 0
        time_limit_seconds:
          $ref: "#/components/schemas/QuestionTimeLimitSeconds"
        question_started_at:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        attempt:
          $ref: "#/components/schemas/AttemptResult"
      oneOf:
        - required: [complete, question_index, time_limit_seconds, question_started_at, server_time]
          properties:
            complete:
              const: false
        - required: [complete, attempt]
          properties:
            complete:
              const: true
    AttemptResult:
      type: object
      required: [id, learner_name, score, max_score, results]
      properties:
        id:
          type: string
          format: uuid
        learner_name:
          type: string
        score:
          type: integer
        max_score:
          type: integer
        results:
          type: array
          items:
            type: object
            required:
              - question_id
              - prompt
              - selected_option_id
              - correct_option_id
              - timed_out
              - points_awarded
              - points_possible
            properties:
              question_id:
                type: string
                format: uuid
              prompt:
                type: string
              selected_option_id:
                type: [string, "null"]
                format: uuid
              correct_option_id:
                type: string
                format: uuid
              timed_out:
                type: boolean
              points_awarded:
                type: integer
              points_possible:
                type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
